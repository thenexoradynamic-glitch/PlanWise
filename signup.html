<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Join PlanWise</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<div
style="
max-width:520px;
margin:70px auto;
">

<div
class="glass-panel">

<div
style="
text-align:center;
font-size:70px;
margin-bottom:10px;
">

🚀

</div>

<h1
style="
font-family:'Baloo 2';
font-size:45px;
text-align:center;
">

Welcome to
<span class="gradient-text">
PlanWise
</span>

</h1>

<p
style="
text-align:center;
color:var(--muted);
margin-bottom:30px;
">

Your student life is about to get
a serious upgrade.

</p>

<label>
Your Name
</label>

<input
id="name"
placeholder="What should we call you?"
>

<label>
Email
</label>

<input
id="email"
type="email"
placeholder="you@example.com"
>

<label>
Password
</label>

<input
id="password"
type="password"
placeholder="Create a strong password"
>

<button
id="signupBtn"
class="btn btn-primary"
style="width:100%">

✨ Create My PlanWise

</button>

<p
id="message"
style="
margin-top:15px;
text-align:center;
">

</p>

<br>

<p
style="
text-align:center;
color:var(--muted);
">

Already have an account?

<a
href="login.html"
style="color:#c4b5fd">

Login

</a>

</p>

</div>

</div>

</div>

<script type="module">

import {
auth,
db
} from "./firebase.js";

import {
createUserWithEmailAndPassword,
updateProfile
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
doc,
setDoc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

document
.getElementById("signupBtn")
.addEventListener("click", async () => {

const name =
document.getElementById("name").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

if (!name || !email || !password) {

message.textContent =
"Please fill everything.";

return;

}

if (password.length < 6) {

message.textContent =
"Password must be at least 6 characters.";

return;

}

try {

const result =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await updateProfile(
result.user,
{
displayName:name
}
);

await setDoc(
doc(
db,
"users",
result.user.uid
),
{
name,
email,
createdAt:
serverTimestamp()
}
);

window.location.href =
"dashboard.html";

} catch(error) {

message.textContent =
error.message;

}

});

</script>

</body>

</html>
