<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlanWise - Sign Up</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #5b5cf0, #7c3aed);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            color: #5b5cf0;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #172033;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #5b5cf0;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 10px;
            background: #5b5cf0;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4849d8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login a {
            color: #5b5cf0;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
        }
    </style>

</head>

<body>

<div class="box">

    <div class="logo">PlanWise</div>

    <h2>Create your account</h2>

    <label for="name">Name</label>

    <input
        type="text"
        id="name"
        placeholder="Enter your name"
    >

    <label for="email">Email</label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email"
    >

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        placeholder="Create a password"
    >

    <button id="signupBtn">
        Create Account
    </button>

    <p id="message"></p>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <a class="back" href="index.html">
        ← Back to PlanWise
    </a>

</div>

</body>

</html>
