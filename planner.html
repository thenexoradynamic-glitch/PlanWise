<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Daily Planner — PlanWise</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<nav class="navbar">

<div class="logo">
📘 PlanWise
</div>

<a
href="dashboard.html"
class="btn">

← Dashboard

</a>

</nav>

<main class="container">

<section class="hero">

<div class="hero-content">

<h1>
📅 Mission Control
</h1>

<p>
Today's mission: get things done without
turning your brain into spaghetti.
</p>

</div>

<div class="hero-mascot">
🚀
</div>

</section>

<br>

<div class="glass-panel">

<h2>
➕ Add Mission
</h2>

<br>

<input
id="taskTitle"
placeholder="What needs to be done?">

<select id="priority">

<option value="low">
🟢 Low Priority
</option>

<option value="medium">
🟡 Medium Priority
</option>

<option value="high">
🔴 High Priority
</option>

</select>

<input
id="taskTime"
type="time">

<button
id="addTask"
class="btn btn-primary">

🚀 Add Mission

</button>

</div>

<section
style="margin-top:35px">

<h2>
🔥 Today's Missions
</h2>

<div id="taskList"></div>

</section>

</main>

<script type="module">

import {
auth,
db
} from "./firebase.js";

import {
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
collection,
addDoc,
query,
where,
orderBy,
onSnapshot,
deleteDoc,
doc,
updateDoc,
serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

import {
protectPage
} from "./auth.js";

protectPage();

let user;

onAuthStateChanged(
auth,
u => {

if (!u) return;

user = u;

loadTasks();

});

document
.getElementById("addTask")
.addEventListener(
"click",
async () => {

const title =
document
.getElementById("taskTitle")
.value.trim();

const priority =
document
.getElementById("priority")
.value;

const time =
document
.getElementById("taskTime")
.value;

if (!title) {

alert("Give your mission a name!");

return;

}

await addDoc(
collection(db,"tasks"),
{
uid:user.uid,
title,
priority,
time,
completed:false,
createdAt:
serverTimestamp()
}
);

document
.getElementById("taskTitle")
.value="";

});

function loadTasks() {

const q =
query(
collection(db,"tasks"),
where(
"uid",
"==",
user.uid
),
orderBy(
"createdAt",
"desc"
)
);

onSnapshot(q,
snapshot => {

const list =
document
.getElementById(
"taskList"
);

list.innerHTML="";

snapshot.forEach(
item => {

const data =
item.data();

const div =
document
.createElement(
"div"
);

div.className="item";

div.innerHTML=`

<div
style="
display:flex;
justify-content:space-between;
gap:15px;
align-items:center">

<div>

<h3>
${data.completed
? "✅"
: "⬜"}
${data.title}
</h3>

<p
style="
color:var(--muted)">

${data.time || ""}
&nbsp;

${data.priority === "high"
? "🔴 High"
: data.priority === "medium"
? "🟡 Medium"
: "🟢 Low"}

</p>

</div>

<div>

<button
class="btn btn-primary complete-btn"
data-id="${item.id}">

${data.completed
? "Undo"
: "Done"}

</button>

<button
class="btn delete-btn"
data-id="${item.id}"
style="background:#ef4444">

🗑️

</button>

</div>

</div>

`;

list.appendChild(div);

});

document
.querySelectorAll(".complete-btn")
.forEach(btn => {

btn.onclick =
async () => {

const id =
btn.dataset.id;

const snap =
snapshot.docs
.find(
d => d.id === id
);

await updateDoc(
doc(
db,
"tasks",
id
),
{
completed:
!snap.data()
.completed
}
);

};

});

document
.querySelectorAll(".delete-btn")
.forEach(btn => {

btn.onclick =
async () => {

await deleteDoc(
doc(
db,
"tasks",
btn.dataset.id
)
);

};

});

});

}

</script>

</body>

</html>
