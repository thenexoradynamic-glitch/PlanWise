<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Planner - PlanWise</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        nav {
            background: #ffffff;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #4f46e5;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-buttons a,
        .nav-buttons button {
            text-decoration: none;
            border: none;
            background: #4f46e5;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-buttons a {
            background: #eef0ff;
            color: #4f46e5;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #666;
        }

        .planner-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .planner-box h2 {
            margin-bottom: 20px;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 170px 140px auto;
            gap: 12px;
            align-items: end;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field label {
            font-size: 14px;
            font-weight: bold;
        }

        .field input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .add-btn {
            padding: 12px 18px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            height: 44px;
        }

        .add-btn:hover {
            background: #4338ca;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
        }

        .tasks-section h2 {
            margin-bottom: 15px;
        }

        #tasksList {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .task-card input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .task-details {
            font-size: 13px;
            color: #777;
        }

        .completed .task-title {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 9px 12px;
            border-radius: 7px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 750px) {
            .form {
                grid-template-columns: 1fr;
            }

            .add-btn {
                width: 100%;
            }

            nav {
                padding: 15px 20px;
            }

            .nav-buttons {
                gap: 5px;
            }

            .nav-buttons a,
            .nav-buttons button {
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">PlanWise</div>

        <div class="nav-buttons">
            <a href="dashboard.html">Dashboard</a>
            <button id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container">

        <div class="heading">
            <h1>Daily Planner 📅</h1>
            <p>Organize your tasks and make every day productive.</p>
        </div>

        <div class="planner-box">

            <h2>Add a Task</h2>

            <div class="form">

                <div class="field">
                    <label for="taskInput">Task</label>
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="e.g. Complete Maths homework"
                    >
                </div>

                <div class="field">
                    <label for="dateInput">Date</label>
                    <input type="date" id="dateInput">
                </div>

                <div class="field">
                    <label for="timeInput">Time</label>
                    <input type="time" id="timeInput">
                </div>

                <button class="add-btn" id="addTaskBtn">
                    Add Task
                </button>

            </div>

            <div id="message"></div>

        </div>

        <div class="tasks-section">

            <h2>My Tasks</h2>

            <div id="tasksList">
                <div class="empty">
                    Loading tasks...
                </div>
            </div>

        </div>

    </div>


    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

        import {
            getDatabase,
            ref,
            push,
            onValue,
            update,
            remove
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD_p5JbBFm303olQGWQD9NPEfD7CH9RBYg",
            authDomain: "planwise-a217c.firebaseapp.com",
            projectId: "planwise-a217c",
            storageBucket: "planwise-a217c.firebasestorage.app",
            messagingSenderId: "308981851844",
            appId: "1:308981851844:web:abafd57ff4bb8591758b91",
            measurementId: "G-9E3C8MFL7Z",

            databaseURL:
                "https://planwise-a217c-default-rtdb.asia-southeast1.firebasedatabase.app"
        };


        // Initialize Firebase
        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getDatabase(app);


        // HTML elements
        const taskInput = document.getElementById("taskInput");
        const dateInput = document.getElementById("dateInput");
        const timeInput = document.getElementById("timeInput");
        const addTaskBtn = document.getElementById("addTaskBtn");
        const tasksList = document.getElementById("tasksList");
        const message = document.getElementById("message");
        const logoutBtn = document.getElementById("logoutBtn");


        // Set today's date automatically
        const today = new Date();

        const year = today.getFullYear();

        const month = String(today.getMonth() + 1).padStart(2, "0");

        const day = String(today.getDate()).padStart(2, "0");

        dateInput.value = `${year}-${month}-${day}`;


        let currentUser = null;


        // Check login status
        onAuthStateChanged(auth, (user) => {

            if (!user) {

                window.location.href = "login.html";

                return;
            }

            currentUser = user;

            loadTasks(user.uid);
        });


        // Add task
        addTaskBtn.addEventListener("click", async () => {

            if (!currentUser) {
                return;
            }


            const task = taskInput.value.trim();

            const date = dateInput.value;

            const time = timeInput.value;


            if (task === "") {

                message.textContent = "Please enter a task.";

                message.style.color = "#dc2626";

                return;
            }


            if (date === "") {

                message.textContent = "Please select a date.";

                message.style.color = "#dc2626";

                return;
            }


            try {

                addTaskBtn.disabled = true;

                addTaskBtn.textContent = "Adding...";


                // Every user gets their own task folder
                const tasksRef = ref(
                    db,
                    `users/${currentUser.uid}/tasks`
                );


                await push(tasksRef, {

                    title: task,

                    date: date,

                    time: time,

                    completed: false,

                    createdAt: Date.now()

                });


                taskInput.value = "";

                timeInput.value = "";


                message.textContent = "Task added successfully!";

                message.style.color = "#16a34a";


                setTimeout(() => {

                    message.textContent = "";

                }, 2000);


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Could not add task: " + error.message;

                message.style.color = "#dc2626";

            }


            addTaskBtn.disabled = false;

            addTaskBtn.textContent = "Add Task";

        });


        // Load tasks from Firebase
        function loadTasks(uid) {

            const tasksRef = ref(
                db,
                `users/${uid}/tasks`
            );


            onValue(tasksRef, (snapshot) => {

                tasksList.innerHTML = "";


                if (!snapshot.exists()) {

                    tasksList.innerHTML = `
                        <div class="empty">
                            No tasks yet. Add your first task above! 🎯
                        </div>
                    `;

                    return;
                }


                const tasks = [];


                snapshot.forEach((childSnapshot) => {

                    tasks.push({

                        id: childSnapshot.key,

                        ...childSnapshot.val()

                    });

                });


                // Sort by date and time
                tasks.sort((a, b) => {

                    const dateA =
                        `${a.date || ""} ${a.time || ""}`;

                    const dateB =
                        `${b.date || ""} ${b.time || ""}`;

                    return dateA.localeCompare(dateB);

                });


                tasks.forEach((task) => {

                    createTaskCard(task);

                });

            });
        }


        // Create task card
        function createTaskCard(task) {

            const card = document.createElement("div");

            card.className =
                "task-card" +
                (task.completed ? " completed" : "");


            const checkbox = document.createElement("input");

            checkbox.type = "checkbox";

            checkbox.checked = task.completed || false;


            checkbox.addEventListener("change", async () => {

                try {

                    const taskRef = ref(
                        db,
                        `users/${currentUser.uid}/tasks/${task.id}`
                    );


                    await update(taskRef, {

                        completed: checkbox.checked

                    });

                } catch (error) {

                    console.error(error);

                }

            });


            const content = document.createElement("div");

            content.className = "task-content";


            const title = document.createElement("div");

            title.className = "task-title";

            title.textContent = task.title;


            const details = document.createElement("div");

            details.className = "task-details";


            let detailsText = "";

            if (task.date) {

                detailsText += "📅 " + formatDate(task.date);

            }

            if (task.time) {

                detailsText += " &nbsp; ⏰ " + formatTime(task.time);

            }


            details.innerHTML = detailsText;


            content.appendChild(title);

            content.appendChild(details);


            const deleteBtn = document.createElement("button");

            deleteBtn.className = "delete-btn";

            deleteBtn.textContent = "Delete";


            deleteBtn.addEventListener("click", async () => {

                const confirmed =
                    confirm("Delete this task?");


                if (!confirmed) {
                    return;
                }


                try {

                    const taskRef = ref(
                        db,
                        `users/${currentUser.uid}/tasks/${task.id}`
                    );


                    await remove(taskRef);

                } catch (error) {

                    console.error(error);

                    alert(
                        "Could not delete task: " +
                        error.message
                    );

                }

            });


            card.appendChild(checkbox);

            card.appendChild(content);

            card.appendChild(deleteBtn);


            tasksList.appendChild(card);

        }


        // Format date
        function formatDate(dateString) {

            const date = new Date(
                dateString + "T00:00:00"
            );


            return date.toLocaleDateString(
                "en-IN",
                {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
                }
            );

        }


        // Format time
        function formatTime(timeString) {

            const [hours, minutes] =
                timeString.split(":");


            const date = new Date();

            date.setHours(
                Number(hours),
                Number(minutes)
            );


            return date.toLocaleTimeString(
                "en-IN",
                {
                    hour: "numeric",
                    minute: "2-digit"
                }
            );

        }


        // Logout
        logoutBtn.addEventListener("click", async () => {

            try {

                await signOut(auth);

                window.location.href = "index.html";

            } catch (error) {

                console.error(error);

                alert("Logout failed.");

            }

        });

    </script>

</body>
</html>
