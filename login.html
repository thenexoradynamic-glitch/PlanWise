<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Login — PlanWise</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<div
style="
max-width:500px;
margin:100px auto;
">

<div class="glass-panel">

<div
style="
font-size:80px;
text-align:center;
">

👋

</div>

<h1
style="
font-family:'Baloo 2';
font-size:50px;
text-align:center;
">

Welcome back.

</h1>

<p
style="
text-align:center;
color:var(--muted);
margin-bottom:30px;
">

Your dashboard missed you.

</p>

<label>Email</label>

<input
id="email"
type="email"
placeholder="you@example.com">

<label>Password</label>

<input
id="password"
type="password"
placeholder="Your password">

<button
id="loginBtn"
class="btn btn-primary"
style="width:100%">

🚀 Enter PlanWise

</button>

<p
id="message"
style="
text-align:center;
margin-top:15px;
">

</p>

<br>

<p
style="
text-align:center;
color:var(--muted);
">

New here?

<a
href="signup.html"
style="color:#c4b5fd">

Create an account

</a>

</p>

</div>

</div>

</div>

<script type="module">

import {
auth
} from "./firebase.js";

import {
signInWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

try {

await signInWithEmailAndPassword(
auth,
email,
password
);

window.location.href =
"dashboard.html";

} catch(error) {

message.textContent =
"❌ " + error.message;

}

});

</script>

</body>

</html>
