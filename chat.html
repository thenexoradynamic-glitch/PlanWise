<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat with Friends - PlanWise</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        nav {
            background: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #4f46e5;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-buttons a,
        .nav-buttons button {
            border: none;
            text-decoration: none;
            background: #4f46e5;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav-buttons a {
            background: #eef0ff;
            color: #4f46e5;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .chat-box {
            background: white;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        #messages {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
        }

        .sender {
            font-size: 13px;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 4px;
        }

        .message-text {
            background: #f3f4f6;
            padding: 10px 13px;
            border-radius: 10px;
            display: inline-block;
            max-width: 80%;
            word-break: break-word;
        }

        .my-message .message-text {
            background: #eef0ff;
        }

        .time {
            font-size: 11px;
            color: #999;
            margin-top: 3px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #eee;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        #sendBtn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

    </style>

</head>


<body>

<nav>

    <div class="logo">
        PlanWise
    </div>

    <div class="nav-buttons">

        <a href="dashboard.html">
            Dashboard
        </a>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</nav>


<div class="container">

    <h1>Chat with Friends 💬</h1>

    <p class="subtitle">
        Talk and study together with your friends.
    </p>


    <div class="chat-box">

        <div id="messages">
            Loading messages...
        </div>


        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
            >

            <button id="sendBtn">
                Send
            </button>

        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    push,
    onValue
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyD_p5JbBFm303olQGWQD9NPEfD7CH9RBYg",

    authDomain: "planwise-a217c.firebaseapp.com",

    projectId: "planwise-a217c",

    storageBucket: "planwise-a217c.firebasestorage.app",

    messagingSenderId: "308981851844",

    appId: "1:308981851844:web:abafd57ff4bb8591758b91",

    measurementId: "G-9E3C8MFL7Z",

    databaseURL:
        "https://planwise-a217c-default-rtdb.asia-southeast1.firebasedatabase.app"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

let currentUser = null;


onAuthStateChanged(
    auth,
    user => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }

        currentUser = user;

        loadMessages();

    }
);


document.getElementById("sendBtn").addEventListener(
    "click",
    sendMessage
);


document.getElementById("messageInput").addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


async function sendMessage() {

    if (!currentUser) {
        return;
    }


    const input =
        document.getElementById("messageInput");

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    try {

        await push(
            ref(
                db,
                "chat/messages"
            ),
            {
                uid: currentUser.uid,
                name:
                    currentUser.displayName ||
                    currentUser.email.split("@")[0],
                text: text,
                createdAt: Date.now()
            }
        );


        input.value = "";

    } catch (error) {

        alert(
            "Could not send message: " +
            error.message
        );

    }

}


function loadMessages() {

    const messagesRef =
        ref(
            db,
            "chat/messages"
        );


    onValue(
        messagesRef,
        snapshot => {

            const container =
                document.getElementById("messages");

            container.innerHTML = "";


            if (!snapshot.exists()) {

                container.textContent =
                    "No messages yet. Start the conversation!";

                return;

            }


            snapshot.forEach(child => {

                const data =
                    child.val();


                const message =
                    document.createElement("div");

                message.className =
                    "message";


                if (
                    data.uid === currentUser.uid
                ) {

                    message.classList.add(
                        "my-message"
                    );

                }


                const sender =
                    document.createElement("div");

                sender.className =
                    "sender";

                sender.textContent =
                    data.name;


                const text =
                    document.createElement("div");

                text.className =
                    "message-text";

                text.textContent =
                    data.text;


                const time =
                    document.createElement("div");

                time.className =
                    "time";

                time.textContent =
                    new Date(
                        data.createdAt
                    ).toLocaleTimeString(
                        "en-IN",
                        {
                            hour: "numeric",
                            minute: "2-digit"
                        }
                    );


                message.appendChild(sender);

                message.appendChild(text);

                message.appendChild(time);

                container.appendChild(message);

            });


            container.scrollTop =
                container.scrollHeight;

        }
    );

}


document.getElementById("logoutBtn").addEventListener(
    "click",
    async () => {

        await signOut(auth);

        window.location.href =
            "index.html";

    }
);

</script>

</body>

</html>
