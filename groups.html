<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Study Groups - PlanWise</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        nav {
            background: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #4f46e5;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-buttons a,
        .nav-buttons button {
            border: none;
            text-decoration: none;
            background: #4f46e5;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav-buttons a {
            background: #eef0ff;
            color: #4f46e5;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .btn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .groups {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .group {
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 12px;
            background: #fafafa;
        }

        .group h3 {
            margin-bottom: 8px;
        }

        .group-code {
            font-size: 13px;
            color: #666;
            margin-bottom: 15px;
        }

        #message {
            margin-top: 15px;
        }

        @media (max-width: 700px) {

            nav {
                padding: 15px 20px;
            }

            .groups {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<nav>

    <div class="logo">
        PlanWise
    </div>

    <div class="nav-buttons">

        <a href="dashboard.html">
            Dashboard
        </a>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</nav>


<div class="container">

    <h1>Study Groups 👥</h1>

    <p class="subtitle">
        Create or join groups and study together.
    </p>


    <div class="card">

        <h2>Create a Study Group</h2>

        <br>

        <div class="field">

            <label>
                Group Name
            </label>

            <input
                id="groupName"
                type="text"
                placeholder="e.g. Grade 9 Maths"
            >

        </div>

        <button
            class="btn"
            id="createBtn"
        >
            Create Group
        </button>

    </div>


    <div class="card">

        <h2>Join a Study Group</h2>

        <br>

        <div class="field">

            <label>
                Group Code
            </label>

            <input
                id="groupCode"
                type="text"
                placeholder="Enter group code"
            >

        </div>

        <button
            class="btn"
            id="joinBtn"
        >
            Join Group
        </button>

        <div id="message"></div>

    </div>


    <div class="card">

        <h2>Available Study Groups</h2>

        <br>

        <div
            class="groups"
            id="groupsList"
        >
            Loading...
        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    get
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

    apiKey: "AIzaSyD_p5JbBFm303olQGWQD9NPEfD7CH9RBYg",

    authDomain: "planwise-a217c.firebaseapp.com",

    projectId: "planwise-a217c",

    storageBucket: "planwise-a217c.firebasestorage.app",

    messagingSenderId: "308981851844",

    appId: "1:308981851844:web:abafd57ff4bb8591758b91",

    measurementId: "G-9E3C8MFL7Z",

    databaseURL:
        "https://planwise-a217c-default-rtdb.asia-southeast1.firebasedatabase.app"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);

let currentUser = null;


function generateCode() {

    return Math.random()
        .toString(36)
        .substring(2, 8)
        .toUpperCase();

}


document.getElementById("createBtn").addEventListener(
    "click",
    async () => {

        if (!currentUser) {
            return;
        }


        const name =
            document.getElementById("groupName")
                .value
                .trim();


        if (!name) {

            showMessage(
                "Enter a group name.",
                false
            );

            return;

        }


        const groupRef =
            push(
                ref(
                    db,
                    "groups"
                )
            );


        const code =
            generateCode();


        try {

            await set(
                groupRef,
                {
                    name: name,
                    code: code,
                    creatorUid: currentUser.uid,
                    creatorName:
                        currentUser.displayName ||
                        currentUser.email,
                    createdAt: Date.now(),
                    members: {
                        [currentUser.uid]: true
                    }
                }
            );


            document.getElementById("groupName")
                .value = "";


            showMessage(
                "Group created! Code: " + code,
                true
            );

        } catch (error) {

            showMessage(
                error.message,
                false
            );

        }

    }
);


document.getElementById("joinBtn").addEventListener(
    "click",
    async () => {

        if (!currentUser) {
            return;
        }


        const code =
            document.getElementById("groupCode")
                .value
                .trim()
                .toUpperCase();


        if (!code) {

            showMessage(
                "Enter a group code.",
                false
            );

            return;

        }


        try {

            const snapshot =
                await get(
                    ref(
                        db,
                        "groups"
                    )
                );


            if (!snapshot.exists()) {

                showMessage(
                    "No groups found.",
                    false
                );

                return;

            }


            let found = false;


            snapshot.forEach(child => {

                const group =
                    child.val();


                if (
                    group.code === code
                ) {

                    found = true;


                    set(
                        ref(
                            db,
                            `groups/${child.key}/members/${currentUser.uid}`
                        ),
                        true
                    );

                }

            });


            if (found) {

                showMessage(
                    "You joined the group!",
                    true
                );

            } else {

                showMessage(
                    "Group code not found.",
                    false
                );

            }

        } catch (error) {

            showMessage(
                error.message,
                false
            );

        }

    }
);


function loadGroups() {

    onValue(
        ref(
            db,
            "groups"
        ),
        snapshot => {

            const list =
                document.getElementById("groupsList");

            list.innerHTML = "";


            if (!snapshot.exists()) {

                list.textContent =
                    "No study groups yet.";

                return;

            }


            snapshot.forEach(child => {

                const group =
                    child.val();


                const card =
                    document.createElement("div");

                card.className =
                    "group";


                const title =
                    document.createElement("h3");

                title.textContent =
                    group.name;


                const code =
                    document.createElement("div");

                code.className =
                    "group-code";

                code.textContent =
                    "Code: " +
                    group.code;


                const creator =
                    document.createElement("div");

                creator.textContent =
                    "Created by: " +
                    group.creatorName;


                card.appendChild(title);

                card.appendChild(code);

                card.appendChild(creator);


                list.appendChild(card);

            });

        }
    );

}


function showMessage(text, success) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.color =
        success
            ? "#16a34a"
            : "#dc2626";

}


onAuthStateChanged(
    auth,
    user => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }

        currentUser = user;

        loadGroups();

    }
);


document.getElementById("logoutBtn").addEventListener(
    "click",
    async () => {

        await signOut(auth);

        window.location.href =
            "index.html";

    }
);

</script>

</body>

</html>
